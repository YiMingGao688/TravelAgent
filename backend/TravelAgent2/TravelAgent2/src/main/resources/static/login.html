<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 智慧出行助手</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-color: #007AFF;
            --primary-hover: #0062CC;
            --bg-color: #FFFFFF;
            --surface-color: #F5F7FA;
            --text-main: #1D1F24;
            --text-secondary: #868B94;
            --border-color: #E5E8EB;
            --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            --transition-smooth: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        #app {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        .brand-section {
            flex: 1;
            background: linear-gradient(135deg, #F5F7FA 0%, #E5F1FF 100%);
            display: flex;
            flex-direction: column;
            padding: 48px;
            position: relative;
            overflow: hidden;
        }

        .brand-section::before {
            content: '';
            position: absolute;
            top: -20%;
            left: -10%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0,122,255,0.1) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            animation: pulse 8s infinite alternate;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 2;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #007AFF, #00C6FF);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            box-shadow: 0 8px 24px rgba(0, 122, 255, 0.25);
        }

        .logo-text {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        .hero-content {
            margin-top: auto;
            margin-bottom: auto;
            z-index: 2;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .hero-title {
            font-size: 56px;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -1.5px;
            margin-bottom: 24px;
            background: linear-gradient(135deg, #1D1F24 0%, #4A505C 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            font-size: 20px;
            color: var(--text-secondary);
            line-height: 1.6;
            max-width: 80%;
            font-weight: 400;
        }

        .auth-section {
            width: 100%;
            max-width: 540px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px;
            background: white;
            position: relative;
        }

        .auth-container {
            width: 100%;
            max-width: 360px;
            animation: fadeIn 0.8s ease forwards;
        }

        .auth-header {
            margin-bottom: 40px;
            text-align: center;
        }

        .auth-header h2 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
        }

        .auth-header p {
            color: var(--text-secondary);
            font-size: 15px;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 16px;
        }

        .input-field {
            width: 100%;
            height: 52px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0 16px 0 44px;
            font-size: 15px;
            font-family: var(--font-family);
            color: var(--text-main);
            transition: var(--transition-smooth);
            background: var(--surface-color);
        }

        .input-field:focus {
            outline: none;
            border-color: var(--primary-color);
            background: white;
            box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.1);
        }

        .input-field::placeholder {
            color: #A0AAB5;
        }

        .forgot-password {
            position: absolute;
            right: 0;
            top: 0;
            font-size: 13px;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .submit-btn {
            width: 100%;
            height: 52px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 32px;
        }

        .submit-btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.2);
        }

        .submit-btn:disabled {
            background-color: #A0CFFF;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 32px 0;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }

        .divider span {
            padding: 0 16px;
        }

        .social-btn {
            width: 100%;
            height: 52px;
            background-color: white;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-main);
            transition: var(--transition-smooth);
            margin-bottom: 16px;
        }

        .social-btn:hover {
            background-color: var(--surface-color);
        }

        .social-btn.wechat i {
            color: #07C160;
            font-size: 20px;
        }

        .toggle-mode {
            text-align: center;
            margin-top: 32px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .toggle-mode a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .toggle-mode a:hover {
            text-decoration: underline;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @media (max-width: 900px) {
            #app {
                flex-direction: column;
            }
            .brand-section {
                flex: none;
                padding: 32px 24px;
                background: white;
            }
            .brand-section::before {
                display: none;
            }
            .hero-title {
                font-size: 36px;
                margin-top: 32px;
                margin-bottom: 16px;
            }
            .hero-subtitle {
                font-size: 16px;
                max-width: 100%;
            }
            .auth-section {
                flex: 1;
                align-items: flex-start;
                padding: 24px;
                max-width: 100%;
            }
            .auth-container {
                max-width: 100%;
            }
            .auth-header {
                display: none;
            }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.1); opacity: 0.8; }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div id="app">
    <div class="brand-section">
        <div class="logo-container">
            <div class="logo-icon">
                <i class="fa-solid fa-plane-departure"></i>
            </div>
            <div class="logo-text">智慧出行助手</div>
        </div>

        <div class="hero-content">
            <h1 class="hero-title">探索世界，<br>从这里开始。</h1>
            <p class="hero-subtitle">由先进AI驱动的旅行规划与出行服务智能体。为你提供一体化出行规划、个性化方案生成及实时行程陪伴。</p>
        </div>
    </div>

    <div class="auth-section">
        <div class="auth-container">
            <div class="auth-header">
                <h2>{{ isLoginMode ? '欢迎回来' : '创建账号' }}</h2>
                <p>{{ isLoginMode ? '登录以继续您的智能出行体验' : '注册以开启您的智能出行体验' }}</p>
            </div>

            <form @submit.prevent="handleSubmit">
                <div class="input-group">
                    <label>邮箱账号</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope"></i>
                        <input
                                type="email"
                                class="input-field"
                                placeholder="name@example.com"
                                v-model="formData.email"
                                required
                        >
                    </div>
                </div>

                <div class="input-group">
                    <label>密码</label>
                    <a href="#" class="forgot-password" v-if="isLoginMode">忘记密码？</a>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input
                                type="password"
                                class="input-field"
                                placeholder="输入您的密码"
                                v-model="formData.password"
                                required
                        >
                    </div>
                </div>

                <button type="submit" class="submit-btn" :disabled="isLoading || !isFormValid">
                    <span v-if="isLoading" class="spinner"></span>
                    <span v-else>{{ isLoginMode ? '登录' : '注册并继续' }}</span>
                </button>
            </form>

            <div class="divider">
                <span>或者</span>
            </div>

            <button class="social-btn wechat" type="button">
                <i class="fa-brands fa-weixin"></i>
                使用微信继续
            </button>
            <button class="social-btn" type="button">
                <i class="fa-brands fa-apple"></i>
                使用 Apple 继续
            </button>

            <div class="toggle-mode">
                {{ isLoginMode ? '还没有账号？' : '已有账号？' }}
                <a @click="toggleMode">{{ isLoginMode ? '立即注册' : '登录现有账号' }}</a>
            </div>
        </div>
    </div>
</div>

<script>
    const { createApp, ref, computed } = Vue;

    createApp({
        setup() {
            const isLoginMode = ref(true);
            const isLoading = ref(false);
            const formData = ref({
                email: '',
                password: ''
            });

            const isFormValid = computed(() => {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return emailRegex.test(formData.value.email) && formData.value.password.length >= 6;
            });

            const toggleMode = () => {
                isLoginMode.value = !isLoginMode.value;
                formData.value.password = '';
            };

            const handleSubmit = async () => {
                if (!isFormValid.value) return;
                isLoading.value = true;

                try {
                    let url = isLoginMode.value
                        ? 'http://localhost:8080/user/login'
                        : 'http://localhost:8080/user/register';

                    const res = await axios.post(url, {
                        email: formData.value.email,
                        password: formData.value.password
                    });

                    if (res.data.code === 200) {
                        sessionStorage.setItem("loginUser", formData.value.email);
                        // 已删除 alert 弹窗，直接跳转！
                        window.location.href = "/chat.html";
                    } else {
                        alert(res.data.msg || "登录失败，账号或密码错误");
                    }
                } catch (err) {
                    alert("请求失败：服务器未启动或网络异常");
                } finally {
                    isLoading.value = false;
                }
            };

            return {
                isLoginMode,
                isLoading,
                formData,
                isFormValid,
                toggleMode,
                handleSubmit
            };
        }
    }).mount('#app');
</script>
</body>
</html>
